{% set name = "menpo" %}
{% set version = "0.12.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 82893c5f5ddcadc1f528f629672e1dbff8411635661c5e5400f05ca20c0f7a90

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - python >=3.7
    - pip

  run:
    - python >=3.7
    - {{ pin_compatible('numpy') }}
    - scipy
    - pillow
    - ffmpeg
    - matplotlib-base
    - cyvlfeat
    - opencv

test:
  imports:
    - menpo
    - menpo.feature
    - menpo.image
    - menpo.io
    - menpo.landmark
    - menpo.math
    - menpo.model
    - menpo.shape
    - menpo.transform
    - menpo.visualize

about:
  home: https://github.com/menpo/menpo
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: 'The Menpo Project Python package for handling annotated data'

extra:
  recipe-maintainers:
    - patricksnape
