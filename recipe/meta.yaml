{% set name = "menpo" %}
{% set version = "0.12.0" %}
# upstream supports 3.10, but conda-forge has no 3.10 builds of cyvlfeat/opencv any more (python_min is 3.11)
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 82893c5f5ddcadc1f528f629672e1dbff8411635661c5e5400f05ca20c0f7a90

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}.*
    - pip
    - setuptools >=77
    - setuptools-scm >=8
  run:
    - python >={{ python_min }}
    - numpy >=1.14
    - scipy >=1.0
    - pillow >=4.0
    - matplotlib-base >=3.0
    - ffmpeg
    - cyvlfeat >=0.8.1
    - opencv

test:
  imports:
    - menpo
    - menpo.feature
    - menpo.image
    - menpo.io
    - menpo.landmark
    - menpo.math
    - menpo.model
    - menpo.shape
    - menpo.transform
    - menpo.visualize
  requires:
    - python {{ python_min }}.*
    - pip
  commands:
    - pip check

about:
  home: https://github.com/menpo/menpo
  dev_url: https://github.com/menpo/menpo
  doc_url: https://menpo.readthedocs.io/en/stable/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: 'The Menpo Project Python package for handling annotated data'

extra:
  recipe-maintainers:
    - patricksnape
